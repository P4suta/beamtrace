version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    labels: ["type: dependencies", "area: ci"]
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:15"
      timezone: "Asia/Tokyo"
    versioning-strategy: increase-if-necessary
    open-pull-requests-limit: 5
    labels: ["type: dependencies", "area: web"]
    groups:
      browser-tooling:
        dependency-type: "development"
        patterns: ["*"]
