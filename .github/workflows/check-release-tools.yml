name: Check release credential tooling

on:
  pull_request:
    paths:
      - release-tools/**
      - scripts/publish-hex.ps1
      - .github/workflows/release.yml
      - .github/workflows/check-release-tools.yml
  push:
    branches: [main]
    paths:
      - release-tools/**
      - scripts/publish-hex.ps1
      - .github/workflows/release.yml
      - .github/workflows/check-release-tools.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: release-tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.99.1
          components: clippy,rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny --locked check advisories
      - run: cargo install kani-verifier --version 0.68.0 --locked
      - run: cargo kani setup
      - run: cargo kani --no-default-features --lib
      - run: cargo test --locked --test proof_gate -- --ignored
