# SPDX-License-Identifier: Apache-2.0 OR MIT
name: TDD

on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: tdd-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pull-request-title:
    name: Conventional pull request title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 'Require type(scope): subject'
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            exit 0
          fi
          if [[ ! "$PR_TITLE" =~ ^[a-z]+\([a-z0-9][a-z0-9-]*\):\ [^[:space:]].+$ ]]; then
            echo "Pull request title must use type(scope): subject" >&2
            exit 1
          fi

  fast:
    name: Linux fast checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: '29'
          gleam-version: '1.18.1'
          rebar3-version: '3.27.0'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked unit tooling
        run: npm ci --ignore-scripts
      - name: Check formatting
        shell: pwsh
        run: ./scripts/check-format.ps1
      - name: Run deterministic unit tests
        shell: pwsh
        run: ./scripts/test-unit.ps1
      - name: Check project names
        shell: pwsh
        run: ./scripts/test-brand.ps1
      - name: Check portable name validation
        shell: pwsh
        run: ./scripts/test-brand-portability.ps1
      - name: Check dependency download retry behavior
        shell: pwsh
        run: ./scripts/test-gleam-network-retry.ps1
      - name: Check documentation contracts
        shell: pwsh
        run: ./scripts/test-docs.ps1
      - name: Check static OCI contracts
        shell: pwsh
        run: ./scripts/test-oci.ps1
      - name: Check test cleanliness
        shell: pwsh
        run: ./scripts/test-cleanliness.ps1

  repository-governance:
    name: Repository governance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release-please config against its pinned schema
        shell: pwsh
        run: ./scripts/test-release.ps1 -ValidateUpstreamSchema
      - name: Verify repository policy as code
        shell: pwsh
        run: ./scripts/test-repository-governance.ps1

  tdd-gate:
    name: TDD Gate
    if: ${{ always() }}
    needs: [pull-request-title, fast, repository-governance]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every fast job to succeed
        shell: pwsh
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = @('pull-request-title', 'fast', 'repository-governance')
          $needs = ConvertFrom-Json -InputObject $env:NEEDS_JSON -AsHashtable -ErrorAction Stop
          if ($needs -isnot [System.Collections.IDictionary] -or $needs.Count -ne $expected.Count) {
              throw 'Fast gate requires the complete job inventory.'
          }
          foreach ($key in $needs.Keys) {
              if ($key -cnotin $expected) { throw "Unexpected fast job: $key" }
          }
          foreach ($key in $expected) {
              $job = $needs[$key]
              if ($job -isnot [System.Collections.IDictionary] -or $job['result'] -isnot [string] -or $job['result'] -cne 'success') {
                  throw "Fast job did not succeed: $key"
              }
          }

  required:
    name: required
    if: ${{ always() }}
    needs: [tdd-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require the completed TDD gate
        shell: pwsh
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = @('tdd-gate')
          $needs = ConvertFrom-Json -InputObject $env:NEEDS_JSON -AsHashtable -ErrorAction Stop
          if ($needs -isnot [System.Collections.IDictionary] -or $needs.Count -ne $expected.Count) {
              throw 'Required gate requires the complete job inventory.'
          }
          foreach ($key in $needs.Keys) {
              if ($key -cnotin $expected) { throw "Unexpected required job: $key" }
          }
          foreach ($key in $expected) {
              $job = $needs[$key]
              if ($job -isnot [System.Collections.IDictionary] -or $job['result'] -isnot [string] -or $job['result'] -cne 'success') {
                  throw "Required job did not succeed: $key"
              }
          }
