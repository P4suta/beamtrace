# SPDX-License-Identifier: Apache-2.0 OR MIT
name: Release Candidate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: release-candidate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: Candidate package / ${{ matrix.platform }} / ${{ matrix.architecture }}
    if: "${{ contains(github.event.pull_request.labels.*.name, 'autorelease: pending') || startsWith(github.head_ref, 'release-please--branches--') }}"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux
            architecture: x64
          - runner: ubuntu-24.04-arm
            platform: linux
            architecture: arm64
          - runner: windows-latest
            platform: windows
            architecture: x64
          - runner: windows-11-arm
            platform: windows
            architecture: arm64
          - runner: macos-15-intel
            platform: macos
            architecture: x64
          - runner: macos-15
            platform: macos
            architecture: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: '29'
          gleam-version: '1.18.1'
          rebar3-version: '3.27.0'
      - name: Build release archive without publishing
        shell: pwsh
        run: ./scripts/package.ps1 -SkipTests
      - name: Require the matrix-specific archive
        shell: pwsh
        run: |
          . ./scripts/project-version.ps1
          $version = Get-BeamTraceVersion -RepositoryRoot $PWD
          $archive = "dist/beamtrace-$version-${{ matrix.platform }}-${{ matrix.architecture }}.zip"
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
            throw "Candidate archive was not produced: $archive"
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-package-${{ matrix.platform }}-${{ matrix.architecture }}
          path: |
            dist/beamtrace-*.zip
            dist/beamtrace-*.zip.sha256
          if-no-files-found: error
          retention-days: 1

  hex:
    name: Candidate Hex tarball
    if: "${{ contains(github.event.pull_request.labels.*.name, 'autorelease: pending') || startsWith(github.head_ref, 'release-please--branches--') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: '29'
          gleam-version: '1.18.1'
          rebar3-version: '3.27.0'
      - name: Build and inspect Hex tarball without publishing
        shell: pwsh
        run: ./scripts/test-hex-package.ps1

  image:
    name: Candidate OCI image
    if: "${{ contains(github.event.pull_request.labels.*.name, 'autorelease: pending') || startsWith(github.head_ref, 'release-please--branches--') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and smoke-test OCI image without pushing
        shell: pwsh
        run: ./scripts/test-oci.ps1 -Build

  metadata:
    name: Candidate Homebrew and Scoop metadata
    if: "${{ always() && (contains(github.event.pull_request.labels.*.name, 'autorelease: pending') || startsWith(github.head_ref, 'release-please--branches--')) && needs.package.result == 'success' }}"
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: candidate-package-*
          path: dist
          merge-multiple: true
      - name: Generate and verify distribution metadata without publishing
        shell: pwsh
        run: |
          . ./scripts/project-version.ps1
          $version = Get-BeamTraceVersion -RepositoryRoot $PWD
          ./scripts/build-distribution-metadata.ps1 `
            -BaseUrl "https://github.com/${{ github.repository }}/releases/download/v$version" `
            -Homepage "https://github.com/${{ github.repository }}"

  gate:
    name: Release Candidate Gate
    if: always()
    needs: [package, hex, image, metadata]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every candidate artifact for release-please PRs
        shell: bash
        env:
          IS_RELEASE_PR: "${{ contains(github.event.pull_request.labels.*.name, 'autorelease: pending') || startsWith(github.head_ref, 'release-please--branches--') }}"
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          if [[ "$IS_RELEASE_PR" == "true" ]]; then
            echo "$NEEDS_JSON" | jq --exit-status 'all(.[]; .result == "success")'
          else
            echo "$NEEDS_JSON" | jq --exit-status 'all(.[]; .result == "skipped")'
          fi
