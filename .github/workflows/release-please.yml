# SPDX-License-Identifier: Apache-2.0 OR MIT
name: Release Please

on:
  push:
    branches: [main]

concurrency:
  group: release-please-main
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    if: >-
      github.repository_id == '1343313550' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    permissions: {}
    name: Update release pull request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-automation
    env:
      APP_INPUTS_VALID: >-
        ${{ secrets.RELEASE_APP_CLIENT_ID != '' &&
        !startsWith(secrets.RELEASE_APP_CLIENT_ID, '${') &&
        secrets.RELEASE_APP_PRIVATE_KEY != '' &&
        !startsWith(secrets.RELEASE_APP_PRIVATE_KEY, '${') }}
    steps:
      - name: Reject missing or unresolved automation credentials
        if: env.APP_INPUTS_VALID != 'true'
        shell: bash
        run: exit 1

      - name: Create repository-scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: beamtrace
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - name: Create or update the release pull request
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
