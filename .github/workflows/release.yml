# SPDX-License-Identifier: Apache-2.0 OR MIT
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release-please tag to recover
        required: true
        type: string
      commit:
        description: Full immutable commit SHA expected for the tag
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  RELEASE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.commit || github.sha }}

jobs:
  draft-release:
    name: Require release-please draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # GitHub only exposes draft releases to tokens with push-equivalent access.
      contents: write
    steps:
      - name: Verify the corresponding prerelease is still a draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          resolved_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)"
          if [[ "$resolved_sha" != "$RELEASE_SHA" ]]; then
            echo "Release tag $RELEASE_TAG resolves to $resolved_sha, expected $RELEASE_SHA." >&2
            exit 1
          fi
          for _attempt in {1..12}; do
            if gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/releases?per_page=100" 2>/dev/null |
              jq --exit-status --arg tag "$RELEASE_TAG" '
                flatten
                | map(select(.tag_name == $tag and .draft == true and .prerelease == true))
                | if length == 1 then .[0] else empty end
              ' >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "The matching release-please draft prerelease does not exist." >&2
          exit 1

  package:
    name: Package / ${{ matrix.platform }} / ${{ matrix.architecture }}
    needs: draft-release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux
            architecture: x64
          - runner: ubuntu-24.04-arm
            platform: linux
            architecture: arm64
          # setup-beam cannot provision a native Windows ARM64 Erlang/OTP runtime.
          - runner: windows-latest
            platform: windows
            architecture: x64
          - runner: macos-15-intel
            platform: macos
            architecture: x64
          - runner: macos-15
            platform: macos
            architecture: arm64
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: '29'
          gleam-version: '1.18.1'
          rebar3-version: '3.27.0'
      - name: Verify release version
        shell: pwsh
        run: ./scripts/assert-release-version.ps1 -Tag $env:RELEASE_TAG
      - name: Build portable archive and SBOM
        shell: pwsh
        run: ./scripts/package.ps1 -SkipTests
      - name: Verify native artifact identity
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $archive = "dist/beamtrace-$version-${{ matrix.platform }}-${{ matrix.architecture }}.zip"
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
            throw "Native package was not produced: $archive"
          }
      - name: Attest portable archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/beamtrace-*.zip
            dist/beamtrace-*.zip.sha256
      - name: Upload portable archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ matrix.platform }}-${{ matrix.architecture }}
          path: |
            dist/beamtrace-*.zip
            dist/beamtrace-*.zip.sha256
          if-no-files-found: error

  hex:
    name: Hex package
    needs: draft-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: '29'
          gleam-version: '1.18.1'
          rebar3-version: '3.27.0'
      - name: Verify release version
        shell: pwsh
        run: ./scripts/assert-release-version.ps1 -Tag $env:RELEASE_TAG
      - name: Build and inspect Hex tarball
        shell: pwsh
        run: ./scripts/test-hex-package.ps1
      - name: Create Hex checksum
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $tarball = Get-Item -LiteralPath "packages/beamtrace_core/build/beamtrace_core-$version.tar"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $tarball.FullName).Hash.ToLowerInvariant()
          "$hash  $($tarball.Name)" | Set-Content -LiteralPath "$($tarball.FullName).sha256" -Encoding ascii
      - name: Attest Hex package
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            packages/beamtrace_core/build/beamtrace_core-*.tar
            packages/beamtrace_core/build/beamtrace_core-*.tar.sha256
      - name: Upload Hex package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hex-package
          path: |
            packages/beamtrace_core/build/beamtrace_core-*.tar
            packages/beamtrace_core/build/beamtrace_core-*.tar.sha256
          if-no-files-found: error

  image:
    name: OCI image archive
    needs: draft-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false
      - name: Verify release version
        shell: pwsh
        run: ./scripts/assert-release-version.ps1 -Tag $env:RELEASE_TAG
      - name: Build and smoke-test OCI image
        shell: pwsh
        run: ./scripts/test-oci.ps1 -Build
      - name: Export the exact OCI image for later publication
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mkdir -p dist
          docker build \
            --label "org.opencontainers.image.revision=$RELEASE_SHA" \
            --label "org.opencontainers.image.version=$version" \
            --tag "beamtrace-release:$version" \
            --file packaging/Dockerfile .
          archive="dist/beamtrace-oci-$version-linux-amd64.tar"
          docker save --output "$archive" "beamtrace-release:$version"
          hash="$(sha256sum "$archive" | cut -d' ' -f1)"
          printf '%s  %s\n' "$hash" "$(basename "$archive")" > "$archive.sha256"
      - name: Attest OCI image archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/beamtrace-oci-*.tar
            dist/beamtrace-oci-*.tar.sha256
      - name: Upload OCI image archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oci-image
          path: |
            dist/beamtrace-oci-*.tar
            dist/beamtrace-oci-*.tar.sha256
          if-no-files-found: error

  metadata:
    name: Homebrew and Scoop metadata
    needs: [draft-release, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Build checksum inventory and package-manager metadata
        shell: pwsh
        run: |
          ./scripts/build-distribution-metadata.ps1 `
            -BaseUrl "https://github.com/${{ github.repository }}/releases/download/$env:RELEASE_TAG" `
            -Homepage "https://github.com/${{ github.repository }}"
      - name: Attest package-manager metadata
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/release-checksums.json
            dist/beamtrace.rb
            dist/beamtrace.json
      - name: Upload package-manager metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distribution-metadata
          path: |
            dist/release-checksums.json
            dist/beamtrace.rb
            dist/beamtrace.json
          if-no-files-found: error

  publish-hex:
    name: Publish Hex
    needs: [package, hex, image, metadata]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
    steps:
      - name: Checkout immutable release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          path: release-source
          persist-credentials: false
      - name: Checkout audited release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tools
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: '29'
          gleam-version: '1.18.1'
          rebar3-version: '3.27.0'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hex-package
          path: dist
      - name: Publish or verify the immutable Hex version
        shell: pwsh
        env:
          HEXPM_API_KEY: ${{ secrets.HEXPM_API_KEY }}
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $releaseSource = (Resolve-Path -LiteralPath 'release-source').Path
          $tarball = (Resolve-Path -LiteralPath "dist/beamtrace_core-$version.tar").Path
          ./release-tools/scripts/publish-hex.ps1 `
            -Version $version `
            -Tarball $tarball `
            -RepositoryRoot $releaseSource

  publish-image:
    name: Publish GHCR
    needs: publish-hex
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      name: ${{ steps.publish.outputs.name }}
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: oci-image
          path: dist
      - name: Authenticate to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish immutable version and commit tags
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          image_name="$(echo "ghcr.io/$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          version="${RELEASE_TAG#v}"
          local_ref="beamtrace-release:$version"
          version_ref="$image_name:$version"
          sha_ref="$image_name:sha-$RELEASE_SHA"
          docker load --input "dist/beamtrace-oci-$version-linux-amd64.tar"
          local_id="$(docker image inspect --format '{{.Id}}' "$local_ref")"

          manifest_exists() {
            local ref="$1"
            local inspect_result normalized
            if ! inspect_result="$(docker manifest inspect "$ref" 2>&1)"; then
              normalized="${inspect_result,,}"
              if [[ "$normalized" == *"manifest unknown"* || "$normalized" == *"no such manifest"* ]]; then
                return 1
              fi
              echo "Could not safely determine whether immutable image tag exists: $ref" >&2
              echo "$inspect_result" >&2
              exit 1
            fi
            return 0
          }

          validate_existing() {
            local ref="$1"
            docker pull "$ref"
            local revision image_version architecture operating_system
            revision="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$ref")"
            image_version="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$ref")"
            architecture="$(docker image inspect --format '{{.Architecture}}' "$ref")"
            operating_system="$(docker image inspect --format '{{.Os}}' "$ref")"
            if [[ "$revision" != "$RELEASE_SHA" || "$image_version" != "$version" || \
                  "$architecture" != "amd64" || "$operating_system" != "linux" ]]; then
              echo "Refusing to reuse mismatched immutable image tag: $ref" >&2
              exit 1
            fi
          }

          version_exists=false
          sha_exists=false
          if manifest_exists "$version_ref"; then
            version_exists=true
            validate_existing "$version_ref"
          fi
          if manifest_exists "$sha_ref"; then
            sha_exists=true
            validate_existing "$sha_ref"
          fi

          if [[ "$version_exists" == true && "$sha_exists" == true ]]; then
            echo 'Both immutable GHCR tags already exist; verifying their shared identity.'
          elif [[ "$version_exists" == true ]]; then
            docker tag "$version_ref" "$sha_ref"
            docker push "$sha_ref"
          elif [[ "$sha_exists" == true ]]; then
            docker tag "$sha_ref" "$version_ref"
            docker push "$version_ref"
          else
            docker tag "$local_ref" "$version_ref"
            docker push "$version_ref"
            docker tag "$local_ref" "$sha_ref"
            docker push "$sha_ref"
          fi

          docker pull "$version_ref"
          docker pull "$sha_ref"
          remote_version_id="$(docker image inspect --format '{{.Id}}' "$version_ref")"
          remote_sha_id="$(docker image inspect --format '{{.Id}}' "$sha_ref")"
          version_digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$version_ref" | cut -d@ -f2)"
          sha_digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$sha_ref" | cut -d@ -f2)"
          version_revision="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$version_ref")"
          sha_revision="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$sha_ref")"
          version_label="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$version_ref")"
          sha_label="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$sha_ref")"
          remote_architecture="$(docker image inspect --format '{{.Architecture}}' "$version_ref")"
          remote_operating_system="$(docker image inspect --format '{{.Os}}' "$version_ref")"
          if [[ ! "$version_digest" =~ ^sha256:[0-9a-f]{64}$ || \
                "$version_digest" != "$sha_digest" || \
                "$remote_version_id" != "$remote_sha_id" || \
                "$version_revision" != "$RELEASE_SHA" || \
                "$sha_revision" != "$RELEASE_SHA" || \
                "$version_label" != "$version" || \
                "$sha_label" != "$version" || \
                "$remote_architecture" != "amd64" || \
                "$remote_operating_system" != "linux" ]]; then
            echo 'GHCR immutable tags do not share the expected digest, config, labels, and platform.' >&2
            exit 1
          fi
          if [[ "$version_exists" == false && "$sha_exists" == false && "$remote_version_id" != "$local_id" ]]; then
            echo 'New GHCR tags do not contain the release image that was built in this run.' >&2
            exit 1
          fi
          echo "name=$image_name" >> "$GITHUB_OUTPUT"
          echo "digest=$version_digest" >> "$GITHUB_OUTPUT"
      - name: Attest published OCI image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.name }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

  verify-published:
    name: Verify published registries
    needs: publish-image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: '29'
          gleam-version: '1.18.1'
          rebar3-version: '3.27.0'
      - name: Authenticate to GHCR for registry smoke tests
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Verify clean Hex consumer, HexDocs, and pulled OCI digest
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          ./scripts/verify-published-release.ps1 `
            -Version $version `
            -Image '${{ needs.publish-image.outputs.name }}' `
            -Digest '${{ needs.publish-image.outputs.digest }}'

  publish-release:
    name: Publish GitHub prerelease
    needs: verify-published
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hex-package
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distribution-metadata
          path: dist
      - name: Upload assets to the existing draft and publish it last
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_id="$(
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
              jq --exit-status --raw-output --arg tag "$RELEASE_TAG" '
                flatten
                | map(select(.tag_name == $tag and .draft == true and .prerelease == true))
                | if length == 1 then .[0].id else empty end
              '
          )"
          [[ "$(find dist -maxdepth 1 -type f -name 'beamtrace-*.zip' | wc -l)" -eq 5 ]]
          [[ "$(find dist -maxdepth 1 -type f -name 'beamtrace-*.zip.sha256' | wc -l)" -eq 5 ]]
          [[ "$(find dist -maxdepth 1 -type f -name 'beamtrace_core-*.tar' | wc -l)" -eq 1 ]]
          gh release upload "$RELEASE_TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F draft=false \
            -F prerelease=true \
            -f name="BeamTrace $RELEASE_TAG" >/dev/null
