# SPDX-License-Identifier: Apache-2.0 OR MIT
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    name: Package / ${{ matrix.platform }} / ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux
            architecture: x64
          - runner: ubuntu-24.04-arm
            platform: linux
            architecture: arm64
          - runner: windows-latest
            platform: windows
            architecture: x64
          - runner: windows-11-arm
            platform: windows
            architecture: arm64
          - runner: macos-15-intel
            platform: macos
            architecture: x64
          - runner: macos-15
            platform: macos
            architecture: arm64
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: '29'
          gleam-version: '1.18.1'
          rebar3-version: '3.27.0'
      - name: Verify release version
        shell: pwsh
        run: ./scripts/assert-release-version.ps1 -Tag '${{ github.ref_name }}'
      - name: Build portable archive and SBOM
        shell: pwsh
        run: ./scripts/package.ps1 -SkipTests
      - name: Verify native artifact identity
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.Substring(1)
          $archive = "dist/beamtrace-$version-${{ matrix.platform }}-${{ matrix.architecture }}.zip"
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
            throw "Native package was not produced: $archive"
          }
      - name: Attest portable archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/beamtrace-*.zip
            dist/beamtrace-*.zip.sha256
      - name: Upload portable archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ matrix.platform }}-${{ matrix.architecture }}
          path: |
            dist/beamtrace-*.zip
            dist/beamtrace-*.zip.sha256
          if-no-files-found: error

  hex:
    name: Hex package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: '29'
          gleam-version: '1.18.1'
          rebar3-version: '3.27.0'
      - name: Verify release version
        shell: pwsh
        run: ./scripts/assert-release-version.ps1 -Tag '${{ github.ref_name }}'
      - name: Build and inspect Hex tarball
        shell: pwsh
        run: ./scripts/test-hex-package.ps1
      - name: Create Hex checksum
        shell: pwsh
        run: |
          $tarball = Get-Item -LiteralPath packages/beamtrace_core/build/beamtrace_core-*.tar
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $tarball.FullName).Hash.ToLowerInvariant()
          "$hash  $($tarball.Name)" | Set-Content -LiteralPath "$($tarball.FullName).sha256" -Encoding ascii
      - name: Attest Hex package
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            packages/beamtrace_core/build/beamtrace_core-*.tar
            packages/beamtrace_core/build/beamtrace_core-*.tar.sha256
      - name: Upload Hex package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hex-package
          path: |
            packages/beamtrace_core/build/beamtrace_core-*.tar
            packages/beamtrace_core/build/beamtrace_core-*.tar.sha256
          if-no-files-found: error

  image:
    name: OCI image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify release version
        shell: pwsh
        run: ./scripts/assert-release-version.ps1 -Tag '${{ github.ref_name }}'
      - name: Authenticate to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build and push OCI image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image_name="$(echo "ghcr.io/$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          version="${GITHUB_REF_NAME#v}"
          docker build --file packaging/Dockerfile --tag "$image_name:$version" .
          docker push "$image_name:$version"
          repo_digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$image_name:$version")"
          echo "name=$image_name" >> "$GITHUB_OUTPUT"
          echo "digest=${repo_digest#*@}" >> "$GITHUB_OUTPUT"
      - name: Attest OCI image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

  metadata:
    name: Homebrew and Scoop metadata
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Build checksum inventory and package-manager metadata
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem -LiteralPath dist -Filter 'beamtrace-*.zip' -File)
          if ($archives.Count -ne 6) { throw "Expected six native archives, found $($archives.Count)." }
          $checksums = [ordered]@{}
          foreach ($archive in $archives) {
            $checksums[$archive.Name] = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive.FullName).Hash.ToLowerInvariant()
          }
          $inventory = Join-Path $PWD 'dist/release-checksums.json'
          $checksums | ConvertTo-Json | Set-Content -LiteralPath $inventory -Encoding utf8NoBOM
          $version = '${{ github.ref_name }}'.Substring(1)
          ./scripts/generate-distribution-metadata.ps1 `
            -Version $version `
            -BaseUrl "https://github.com/$env:GITHUB_REPOSITORY/releases/download/${{ github.ref_name }}" `
            -Homepage "https://github.com/$env:GITHUB_REPOSITORY" `
            -ChecksumsPath $inventory `
            -OutputDirectory dist
      - name: Attest package-manager metadata
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/beamtrace.rb
            dist/beamtrace.json
      - name: Upload package-manager metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distribution-metadata
          path: |
            dist/beamtrace.rb
            dist/beamtrace.json
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [package, hex, image, metadata]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "BeamTrace ${GITHUB_REF_NAME#v}"
