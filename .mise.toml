[tools]
gleam = "1.18.1"
erlang = "29.0.5"
node = "24.19.0"
powershell = "7.6.5"

[tasks."test:unit"]
description = "Run deterministic unit suites without external sockets or optional ecosystems"
run = "bash scripts/test-unit.sh"

[tasks."test:integration"]
description = "Run socket, EPMD, Rebar3, and Mix integration tests when prerequisites exist"
run = "bash scripts/test-integration.sh"

[tasks.test]
description = "Run the reproducible local unit and available integration suites"
run = "bash scripts/test-unit.sh && bash scripts/test-integration.sh && pwsh -NoProfile -File scripts/test-docs.ps1"

[tasks."test:docs"]
description = "Validate user documentation and versioned reference markers"
run = "pwsh -NoProfile -File scripts/test-docs.ps1"

[tasks.format]
description = "Format every Gleam package"
run = "for package in packages/beamtrace_core packages/beamtrace_runtime packages/beamtrace_tui packages/beamtrace_web; do (cd \"$package\" && gleam format src test); done"

[tasks."web:build"]
description = "Build the checked-in Web distribution"
run = "bash scripts/build-web.sh"

[tasks.beamtrace]
description = "Run the CLI from source with the built agent BEAM and Web assets (mise run beamtrace -- demo)"
run = "pwsh -NoProfile -File scripts/beamtrace.ps1"

[tasks."build:agent"]
description = "Compile the dependency-free injected agent BEAM"
run = "pwsh -NoProfile -File scripts/build-agent.ps1"

[tasks."test:all"]
description = "Run the CI gate (scripts/test-all.ps1 without the browser suite)"
run = "pwsh -NoProfile -File scripts/test-all.ps1 -SkipBrowserE2E"

[tasks."test:cli"]
description = "Run the CLI smoke gate"
run = "pwsh -NoProfile -File scripts/test-cli-smoke.ps1"

[tasks."test:package"]
description = "Build the native archive and smoke-test it without a host Erlang"
run = "pwsh -NoProfile -File scripts/test-package.ps1"

[tasks."test:record"]
description = "Run the record dogfood gate"
run = "pwsh -NoProfile -File scripts/test-record-dogfood.ps1"

[tasks."test:clean"]
description = "Fail on leftover crash dumps and package test directories"
run = "pwsh -NoProfile -File scripts/test-cleanliness.ps1"
