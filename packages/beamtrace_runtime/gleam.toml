name = "beamtrace_runtime"
version = "0.2.0"
target = "erlang"
gleam = ">= 1.18.0 and < 2.0.0"
licences = ["Apache-2.0", "MIT"]
description = "BeamTrace CLI, hub, relay, collector, API, and trace storage"

[dependencies]
beamtrace_core = { path = "../beamtrace_core" }
beamtrace_tui = { path = "../beamtrace_tui" }
argv = ">= 1.1.0 and < 2.0.0"
gleam_stdlib = ">= 0.70.0 and < 2.0.0"
gleam_json = ">= 2.3.0 and < 4.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.3.0 and < 2.0.0"
gleam_http = ">= 4.0.0 and < 5.0.0"
wisp = ">= 2.2.0 and < 3.0.0"
mist = ">= 6.0.0 and < 7.0.0"
sqlight = "1.2.0"
tom = "2.1.0"
gleam_crypto = "1.6.0"

[dev-dependencies]
gleeunit = ">= 1.9.0 and < 2.0.0"
