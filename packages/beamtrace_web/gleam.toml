name = "beamtrace_web"
version = "0.1.0"
target = "javascript"
gleam = ">= 1.18.0 and < 2.0.0"
licences = ["Apache-2.0", "MIT"]
description = "Lustre and Canvas causal workspace for BeamTrace"

[dependencies]
beamtrace_core = { path = "../beamtrace_core" }
gleam_stdlib = ">= 0.70.0 and < 2.0.0"
gleam_json = ">= 2.3.0 and < 4.0.0"
lustre = ">= 5.7.0 and < 6.0.0"

[dev-dependencies]
gleeunit = ">= 1.9.0 and < 2.0.0"
lustre_dev_tools = ">= 2.3.0 and < 3.0.0"

[tools.lustre.build]
no_html = true
no_tailwind = true
outdir = "dist"
