[package]
name = "beamtrace-release-tools"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[features]
default = ["client"]
client = ["dep:anyhow", "dep:reqwest", "dep:serde", "dep:serde_json"]
rejection-probe = []

[dependencies]
anyhow = { version = "1.0.103", optional = true }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "form", "query", "rustls"], optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.150", optional = true }

[dev-dependencies]
tempfile = "3.27.0"

[[bin]]
name = "hex-workload"
path = "src/main.rs"
required-features = ["client"]

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[lints.clippy]
all = "warn"
pedantic = "warn"
